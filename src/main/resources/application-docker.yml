server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:my_mall}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: 0

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    connection-timeout: ${RABBITMQ_TIMEOUT:1s}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: my_mall.entity
  configuration:
    map-underscore-to-camel-case: true

kkek:
  jwt:
    admin-secret-key: ${JWT_ADMIN_KEY:changeMe}
    admin-ttl: 7200000
    admin-token-name: token
    user-secret-key: ${JWT_USER_KEY:changeMe}
    user-ttl: 7200000
    user-token-name: token

aliyun:
  oss:
    access-key-id: ${OSS_KEY_ID}
    access-key-secret: ${OSS_KEY_SECRET}
    bucket-name: ${OSS_BUCKET}
    endpoint: ${OSS_ENDPOINT}
